<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Ginástica em Dia</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="pagina-login">
        <section class="conteudo-login">
            <h1>Crie sua conta</h1>

            <p>Preencha seus dados para participar das aulas da sua empresa.</p>
            {% if erro %}
                <div class="mensagem-erro">
                {{ erro }}
                </div>
            {% endif %}

            {% if sucesso %}
                <div class="mensagem-sucesso">
                {{ sucesso }}
                </div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('cadastro') }}">
                <label for="codigo_empresa">Código da empresa</label>
                <input
                    type="text"
                    id="codigo_empresa"
                    name="codigo_empresa"
                    placeholder="Digite o código fornecido pela empresa"
                    value="{{ codigo_empresa or '' }}"
                    required
                >

                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    value="{{ nome or '' }}"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    value="{{ email or '' }}"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    required
                >

                <button type="submit">Criar conta</button>
            </form>
        </section>
    </main>
</body>

</html>
