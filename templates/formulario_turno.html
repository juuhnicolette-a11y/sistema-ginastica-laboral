
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} | Ginástica em Dia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="painel-empresa">
        <a href="{{ url_for('listar_turnos') }}" class="link-voltar">
            ← Voltar aos turnos
        </a>

        <header class="painel-cabecalho">
            <h1>{{ titulo }}</h1>
            <p>Defina os dias e o horário das atividades.</p>
        </header>

        <section class="formulario-empresa">
            {% with mensagens = get_flashed_messages() %}
                {% for mensagem in mensagens %}
                    <p class="mensagem-formulario">{{ mensagem }}</p>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <label for="nome">Nome do turno</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ dados.nome }}"
                    placeholder="Ex.: Turma da manhã"
                    required
                >

                <label for="horario">Horário da atividade</label>
                <input
                    type="time"
                    id="horario"
                    name="horario"
                    value="{{ dados.horario }}"
                    required
                >

                <label>Dias da semana</label>

                <div class="dias-semana-opcoes">
                    {% for valor, nome in dias_semana %}
                        <label class="dia-opcao">
                            <input
                                type="checkbox"
                                name="dias_semana"
                                value="{{ valor }}"
                                {% if valor in dados.dias_semana.split(',') %}checked{% endif %}
                            >
                            {{ nome }}
                        </label>
                    {% endfor %}
                </div>

                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="ativo" {% if dados.status == 'ativo' %}selected{% endif %}>Ativo</option>
                    <option value="inativo" {% if dados.status == 'inativo' %}selected{% endif %}>Inativo</option>
                </select>

                <button type="submit" class="botao-salvar">
                    {{ texto_botao }}
                </button>
            </form>
        </section>
    </main>
</body>
</html>
