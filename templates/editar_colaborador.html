
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar colaborador | Ginástica em Dia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="painel-empresa">
        <a href="{{ url_for('listar_colaboradores') }}" class="link-voltar">
            ← Voltar aos colaboradores
        </a>

        <header class="painel-cabecalho">
            <h1>Editar colaborador</h1>
            <p>Atualize os dados e o vínculo com o turno.</p>
        </header>

        <section class="formulario-empresa">
            {% with mensagens = get_flashed_messages() %}
                {% for mensagem in mensagens %}
                    <p class="mensagem-formulario">{{ mensagem }}</p>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ colaborador.nome }}"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ colaborador.email }}"
                    required
                >

                <label for="turno_id">Turno</label>
                <select id="turno_id" name="turno_id">
                    <option value="">Sem turno definido</option>
                    {% for turno in turnos %}
                        <option
                            value="{{ turno.id }}"
                            {% if colaborador.turno_id|string == turno.id|string %}selected{% endif %}
                        >
                            {{ turno.nome }}
                        </option>
                    {% endfor %}
                </select>

                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="ativo" {% if colaborador.status == 'ativo' %}selected{% endif %}>
                        Ativo
                    </option>
                    <option value="inativo" {% if colaborador.status == 'inativo' %}selected{% endif %}>
                        Inativo
                    </option>
                </select>

                <button type="submit" class="botao-salvar">
                    Salvar alterações
                </button>
            </form>
        </section>
    </main>
</body>
</html>
